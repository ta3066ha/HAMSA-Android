name: Build HAMSA APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.1
          flet --version

      - name: Install dependencies
        run: |
          pip install aiohttp
          pip install jdatetime
          pip install pandas
          pip install numpy
          pip install scikit-learn
          pip install flet-geolocator==1.0.1
          pip install flet-webview==1.0.1

      - name: Build APK
        env:
          CI: "1"
        run: |
          yes | flet build apk \
            --module-name HAMSA_android \
            --permissions location

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HAMSA-APK
          path: build/apk/*.apk
          if-no-files-found: error
