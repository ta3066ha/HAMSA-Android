name: Build HAMSA APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.0
          flet --version

      - name: Install dependencies
        run: |
          pip install jdatetime flet-geolocator flet-webview

      - name: Build APK
        run: |
          flet build apk \
            --module-name HAMSA_android \
            --permissions location

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HAMSA-APK
          path: build/apk/*.apk
          if-no-files-found: error
