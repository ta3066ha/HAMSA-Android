
<!DOCTYPE html>
<html lang="fa">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>انتخاب مکان HAMSA</title>

    <link
        rel="stylesheet"
        href="https://cdn.map.ir/web-sdk/1.4.2/css/mapp.min.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.map.ir/web-sdk/1.4.2/css/fa/style.css"
    >

    <style>

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;
        }

        #app {

            width: 100%;
            height: 100%;
        }

        #location {

            position: absolute;

            bottom: 20px;
            left: 20px;
            right: 20px;

            background: white;

            padding: 12px;

            border-radius: 12px;

            font-family: sans-serif;

            text-align: center;

            z-index: 9999;
        }

    </style>

</head>


<body>

    <div id="app"></div>

    <div id="location">
        روی نقشه یک نقطه انتخاب کنید
    </div>


    <script

    </script>

        type="text/javascript"
        src="https://cdn.map.ir/web-sdk/1.4.2/js/mapp.env.js">
    </script>

    <script
        type="text/javascript"
        src="https://cdn.map.ir/web-sdk/1.4.2/js/mapp.min.js">
    </script>


    <script>

        $(document).ready(function () {

            var app = new Mapp({

                element: '#app',

                presets: {

                    latlng: {

                        lat: 35.73249,

            });


            app.addLayers();


            app.map.on('click', function (event) {

                var lat = event.latlng.lat;
                var lng = event.latlng.lng;


                document.getElementById('location').innerHTML =

                    lat.toFixed(6) +

                    lng.toFixed(6);


                console.log('Latitude:', lat);
                console.log('Longitude:', lng);
                window.location.href = "hamsa://location?lat=" + lat + "&lng=" + lng;
