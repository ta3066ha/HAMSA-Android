[project]
name = "hamsa-android"
version = "1.0.0"
description = "HAMSA weather application"
requires-python = ">=3.12,<3.13"

dependencies = [
    "flet==1.0.1",
    "aiohttp",
    "jdatetime",
    "flet-geolocator==1.0.1",
    "flet-webview==1.0.1",
    "pandas",
    "numpy",
    "scikit-learn"
]

[tool.flet]
product = "همسا"
org = "com.hamsa"
icon_background = "#112432"

[tool.flet.android]
permissions = [
    "location"
]
extract_packages = [
    "sklearn"
]

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
